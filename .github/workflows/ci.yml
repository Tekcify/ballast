name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: macos-26
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Show toolchain
        run: swift --version
      - name: Build debug
        run: swift build
      - name: Build release
        run: swift build -c release
      - name: Bundle without installing
        run: ./build.sh --no-install
