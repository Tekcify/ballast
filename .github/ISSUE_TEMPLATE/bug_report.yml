name: Bug report
description: Something in Ballast is wrong or broken
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        If Ballast deleted, or offered to delete, something it should not have, please report it privately instead. See SECURITY.md.
  - type: textarea
    id: what
    attributes:
      label: What happened
      description: What you saw, and what you expected instead.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Open the Storage pane
        2. Start a scan
        3. ...
    validations:
      required: true
  - type: textarea
    id: diagnostic
    attributes:
      label: Diagnostic output
      description: Output of `BALLAST_DIAGNOSTIC=1` (memory) or `BALLAST_DIAGNOSTIC=scan` (storage), if relevant. Trim personal paths if you like.
      render: text
  - type: input
    id: macos
    attributes:
      label: macOS version
      placeholder: macOS 15.4 on an M2 Pro
    validations:
      required: true
  - type: input
    id: commit
    attributes:
      label: Ballast commit
      description: Output of `git rev-parse --short HEAD` in your clone.
